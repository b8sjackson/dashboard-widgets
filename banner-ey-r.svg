<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="120" viewBox="0 0 1500 120">
<defs><clipPath id="rc"><rect width="1500" height="120" rx="24" ry="24"/></clipPath>
<linearGradient id="eySatin" x1="0" y1="0" x2="1" y2="0.6"><stop offset="0" stop-color="#0D1116"/><stop offset="0.55" stop-color="#161D23"/><stop offset="1" stop-color="#1D262E"/></linearGradient>
<linearGradient id="eyBeam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFE600" stop-opacity="0"/><stop offset="0.35" stop-color="#FFE600" stop-opacity="1"/><stop offset="1" stop-color="#FFE600" stop-opacity="1"/></linearGradient>
<linearGradient id="eyGlint" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.55"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<linearGradient id="eySweep" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFE600" stop-opacity="0"/><stop offset="0.5" stop-color="#FFE600" stop-opacity="0.06"/><stop offset="1" stop-color="#FFE600" stop-opacity="0"/></linearGradient>
<clipPath id="beamClip"><path d="M 1178 0 L 1212 0 L 1178 120 L 1144 120 Z"/></clipPath>
</defs>
<g clip-path="url(#rc)">
<rect width="1500" height="120" fill="#161D23"/>
<rect width="1500" height="120" fill="url(#eySatin)"/>
<line x1="120" y1="0" x2="80" y2="120" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/><line x1="230" y1="0" x2="190" y2="120" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/><line x1="340" y1="0" x2="300" y2="120" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/><line x1="450" y1="0" x2="410" y2="120" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/><line x1="560" y1="0" x2="520" y2="120" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/><line x1="670" y1="0" x2="630" y2="120" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/><line x1="780" y1="0" x2="740" y2="120" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/><line x1="890" y1="0" x2="850" y2="120" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/><line x1="1000" y1="0" x2="960" y2="120" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/><line x1="1110" y1="0" x2="1070" y2="120" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/><line x1="1220" y1="0" x2="1180" y2="120" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/><line x1="1330" y1="0" x2="1290" y2="120" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/><line x1="1440" y1="0" x2="1400" y2="120" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
<rect x="0" y="52" width="1500" height="1" fill="#FFFFFF" fill-opacity="0.08"/>
<!-- faint yellow sweep across the field -->
<rect x="-400" y="0" width="400" height="120" fill="url(#eySweep)">
  <animateTransform attributeName="transform" type="translate" values="0 0; 1900 0; 1900 0" keyTimes="0;0.4;1" dur="18s" repeatCount="indefinite"/>
</rect>
<path d="M 1178 0 L 1212 0 L 1178 120 L 1144 120 Z" fill="url(#eyBeam)">
  <animate attributeName="opacity" values="0.85;1;0.85" dur="5s" repeatCount="indefinite"/>
</path>
<!-- glint travelling down the beam -->
<g clip-path="url(#beamClip)">
  <rect x="1120" y="-40" width="120" height="26" fill="url(#eyGlint)" transform="skewX(-16)">
    <animate attributeName="y" values="-40;140;140" keyTimes="0;0.25;1" dur="7s" repeatCount="indefinite"/>
  </rect>
</g>
<rect x="0" y="118" width="1500" height="2" fill="#FFE600" fill-opacity="0.75"/>
</g>
</svg>